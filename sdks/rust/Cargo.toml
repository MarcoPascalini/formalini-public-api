[package]
name = "formalini-public-api-client"
version = "0.1.0"
edition = "2021"
authors = ["Marco Pascalini <contact@pascalini.com>"]
license = "Apache-2.0"
description = "Client for the Formalini public document API"
publish = false

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
mockito = "1"
