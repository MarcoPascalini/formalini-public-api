name: Verify
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: PYTHONPATH=sdks/python/src python -m unittest discover -s sdks/python/tests -v
      - run: python -m pip install ruff==0.13.2 mypy==1.17.1 build
      - run: ruff check sdks/python scripts
      - run: ruff format --check sdks/python scripts
      - run: mypy sdks/python/src/formalini --ignore-missing-imports
      - run: python -m build sdks/python
  javascript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/javascript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: npm test
      - run: npm pack --dry-run
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json
      - run: php -l sdks/php/src/Client.php
      - run: php sdks/php/tests/run.php
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project sdks/dotnet/Formalini.Tests/Formalini.Tests.csproj --configuration Release
      - run: dotnet pack sdks/dotnet/Formalini/Formalini.csproj --configuration Release
  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: mvn -B package dependency:build-classpath -Dmdep.outputFile=classpath.txt
      - run: javac -cp "target/classes:$(cat classpath.txt)" -d target/test-classes src/test/java/com/formalini/FormaliniClientTest.java
      - run: java -cp "target/classes:target/test-classes:$(cat classpath.txt)" com.formalini.FormaliniClientTest
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
      - run: go test ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
  ruby:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/ruby
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: ruby -I lib test/client_test.rb
      - run: gem build formalini.gemspec
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openapi-spec-validator==0.7.2
      - run: openapi-spec-validator openapi/formalini-public-v1.yaml
      - run: python scripts/check_links.py
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed Formalini keys
        shell: bash
        run: |
          if git grep -n -I -E '(pf_live_|fm_live_)[A-Za-z0-9_-]{16,}' -- .; then
            echo 'Potential Formalini credential found'
            exit 1
          fi
