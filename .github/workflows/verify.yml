name: Verify
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: PYTHONPATH=sdks/python/src python -m unittest discover -s sdks/python/tests -v
  javascript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/javascript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: npm test
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json
      - run: php -l sdks/php/src/Client.php
      - run: php sdks/php/tests/run.php
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project sdks/dotnet/Formalini.Tests/Formalini.Tests.csproj --configuration Release
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: mvn -B -f sdks/java/pom.xml package
      - run: mvn -B -f sdks/java/pom.xml dependency:build-classpath -Dmdep.outputFile=classpath.txt
      - run: javac -cp "sdks/java/target/classes:$(cat sdks/java/classpath.txt)" -d sdks/java/target/test-classes sdks/java/src/test/java/com/formalini/FormaliniClientTest.java
      - run: java -cp "sdks/java/target/classes:sdks/java/target/test-classes:$(cat sdks/java/classpath.txt)" com.formalini.FormaliniClientTest
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
      - run: go test ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openapi-spec-validator==0.7.2
      - run: openapi-spec-validator openapi/formalini-public-v1.yaml
      - run: python scripts/check_links.py
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed Formalini keys
        shell: bash
        run: |
          if git grep -n -I -E '(pf_live_|fm_live_)[A-Za-z0-9_-]{16,}' -- .; then
            echo 'Potential Formalini credential found'
            exit 1
          fi
