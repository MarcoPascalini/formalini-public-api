openapi: 3.0.3
info:
  title: Formalini Public API
  version: 1.0.0
  description: Published API contract from https://formalini.com/docs; response objects remain extensible where the docs do not enumerate every field.
servers:
  - url: https://api.formalini.com/api/public/v1
security:
  - bearerAuth: []
paths:
  /documents:
    get:
      summary: List workspace documents and extracted fields
      operationId: listDocuments
      description: Requires documents.read.
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
        - in: query
          name: status
          schema: {type: string, enum: [queued, processing, review, approved, exported, failed]}
      responses:
        '200':
          description: Documents, newest first
          content:
            application/json:
              schema:
                type: object
                required: [documents]
                properties:
                  documents:
                    type: array
                    items: {$ref: '#/components/schemas/Document'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      summary: Create a document with existing data
      operationId: createDocument
      description: Requires documents.write.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                category: {type: string}
                vendor: {type: string}
                amount: {type: number}
                document_date: {type: string, format: date}
                fields:
                  type: array
                  maxItems: 400
                  items: {$ref: '#/components/schemas/FieldInput'}
      responses:
        '200': {$ref: '#/components/responses/DocumentResult'}
        '201': {$ref: '#/components/responses/DocumentResult'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /documents/upload:
    post:
      summary: Upload page images for extraction
      operationId: uploadDocument
      description: Requires documents.write. JPEG, PNG, WebP and HEIC are accepted; PDF is not. Repeat file once per page. Each page may be up to 100 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: array
                  minItems: 1
                  maxItems: 25
                  items: {type: string, format: binary}
                name: {type: string}
                template_id: {type: string}
                async: {type: boolean, description: "Return 202 and poll GET /documents/{id}"}
      responses:
        '200': {$ref: '#/components/responses/DocumentResult'}
        '201': {$ref: '#/components/responses/DocumentResult'}
        '202': {$ref: '#/components/responses/DocumentResult'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '402': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /documents/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
    get:
      summary: Retrieve a document and its fields
      operationId: getDocument
      description: Requires documents.read.
      responses:
        '200': {$ref: '#/components/responses/DocumentResult'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
    patch:
      summary: Correct fields or change document status
      operationId: updateDocument
      description: Requires documents.write.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: {type: string, enum: [review, approved, exported]}
                fields:
                  type: array
                  items:
                    type: object
                    required: [name, value]
                    properties:
                      name: {type: string}
                      value: {}
      responses:
        '200':
          description: Change acknowledged
          content:
            application/json:
              schema:
                type: object
                required: [ok, updated_fields]
                properties:
                  ok: {type: boolean}
                  updated_fields: {type: integer}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /workflows/dispatch:
    post:
      summary: Dispatch an event to subscribed webhooks
      operationId: dispatchWorkflow
      description: Requires workflows.run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, document_id]
              properties:
                event: {type: string, enum: [document.processed, document.needs_review, document.approved, document.exported]}
                document_id: {type: string}
                payload: {type: object, additionalProperties: true}
      responses:
        '200':
          description: Event accepted
          content:
            application/json:
              schema:
                type: object
                required: [ok, event, document_id]
                properties:
                  ok: {type: boolean}
                  event: {type: string}
                  document_id: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Permission-scoped API key
  schemas:
    FieldInput:
      type: object
      required: [name, value]
      properties:
        name: {type: string}
        value: {}
        type: {type: string}
        confidence: {type: number}
        page: {type: integer}
    Document:
      type: object
      required: [id, name, status]
      properties:
        id: {type: string}
        name: {type: string}
        status: {type: string}
        average_confidence: {type: number}
        source: {type: string}
        created_at: {type: string, format: date-time}
        fields:
          type: array
          items:
            type: object
            additionalProperties: true
    Error:
      type: object
      additionalProperties: true
      properties:
        error: {type: string}
  responses:
    DocumentResult:
      description: A document result; fields vary with processing status and template
      content:
        application/json:
          schema:
            type: object
            required: [document]
            properties:
              document: {$ref: '#/components/schemas/Document'}
    Error:
      description: Request failed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RateLimited:
      description: Request rate exceeded
      headers:
        Retry-After:
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
